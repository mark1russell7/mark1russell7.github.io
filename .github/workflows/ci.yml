name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The writing rules (ASD-STE100) of the README files, the doc comments and the text of the site
      - run: pnpm lint:ste

  # The one check of the ruleset of main (template CI.md, "The check of the ruleset"). It passes only when
  # each job of needs passed or was skipped by its own if. A new job of this file goes in needs, so the
  # ruleset never has to change, and gh pr merge --auto waits for the whole gate.
  ci-ok:
    name: CI OK
    if: always()
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Each job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
