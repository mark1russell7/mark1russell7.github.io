# Builds packages/site and publishes it to GitHub Pages at https://mark1russell7.github.io/, with the shared
# Pages workflow of mark1russell7 (reusable-pages.yml of mark1russell7/template, its CI.md). It adds the
# Releases page and the Status page (releases/, status/ and their data/*.json).
# To use this workflow, set the Pages source of the repository to "GitHub Actions" (Settings > Pages).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # A repository can ask for a new discovery when its site changes (event type pages-site).
  repository_dispatch:
    types: [pages-site]
  # Each hour, the check job finds the Pages sites of the other repositories again. It deploys only when the list
  # changed, so a new site shows in the pool in an hour, and an hour with no change costs one short job.
  # The run at 06:17 always deploys, so the Status page shows the open pull requests of the day.
  schedule:
    - cron: "13 * * * *"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The hourly run only: compare a new discovery with the list of the live site.
  check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: node packages/site/scripts/discover.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: compare
        run: |
          if [ "$(date -u +%H)" = "06" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::The daily run deploys, for the Status page."
          elif curl -fsS https://mark1russell7.github.io/discovered.json -o live.json && cmp -s <(jq -S . live.json) <(jq -S . packages/site/src/discovered.json); then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::The list of sites changed, so this run deploys."
          fi

  pages:
    needs: check
    # Each push, dispatch and repository dispatch builds. The hourly run builds only when the list changed, or at 06:17.
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.check.outputs.changed == 'true') }}
    # One deployment at a time, on this job only: an hourly run with no change does not cancel a deployment.
    concurrency:
      group: pages
      cancel-in-progress: false
    uses: mark1russell7/template/.github/workflows/reusable-pages.yml@e035fa69560ec82e176f1f7bdcb6760c8b15af54 # main
    # The build job of the shared workflow gets only the read permissions. Only its deploy job,
    # which runs no code of the repository, writes to Pages.
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
      pages: write
      id-token: write
    with:
      # The discovery needs the token, for the list of the repositories with a Pages site.
      github-token: true
      build: |
        node packages/site/scripts/discover.ts
        pnpm --filter @portfolio/site build
        node packages/site/scripts/manifest.ts
      out: packages/site/dist
      # The Releases page and the Status page, at the root of the domain
      base: /
      site-name: mark1russell7.github.io
      # The Status page shows this roadmap. The rule roadmap-parses reads it on each PR.
      roadmap: docs/ROADMAP.md
